name: Run Fish Bot



on:

  workflow_dispatch:
  


jobs:

  run-bot:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout code
      
        uses: actions/checkout@v3
        


      - name: Set up Python
      
        uses: actions/setup-python@v4
        
        with:
        
          python-version: '3.10'
          


      - name: Install dependencies
      
        run: |
        
          python -m pip install --upgrade pip
          
          pip install -r requirements.txt
          


      - name: Run Bot
      
        env:
        
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          
        run: python bot.py
        


















